name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm tsc --noEmit
      - name: Unit + integration tests (skip live contract tests)
        run: pnpm test
        env:
          SKIP_CONTRACT_TESTS: "true"
          JWT_SECRET: "ci-test-secret"
          DATABASE_URL: ""

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check live API reachability
        id: reachability
        run: |
          API_URL="https://citation.is"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" "${API_URL}/api/public/claims?page_size=1" || echo "000")
          if [ "$STATUS" != "200" ]; then
            API_URL="https://citation.manus.space"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" "${API_URL}/api/public/claims?page_size=1" || echo "000")
          fi
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "Live API is reachable at ${API_URL} (HTTP $STATUS). Running contract tests."
          else
            echo "::warning::Both citation.is and citation.manus.space returned non-200 (last: HTTP $STATUS). Contract tests will be skipped."
          fi
      - name: Run API contract test against live API
        if: steps.reachability.outputs.status == '200'
        run: pnpm test server/apiContract.test.ts
        env:
          TTRUTHDESK_BASE_URL: ${{ steps.reachability.outputs.api_url }}
          SKIP_CONTRACT_TESTS: "false"
          JWT_SECRET: "ci-test-secret"
          DATABASE_URL: ""
      - name: Skip contract tests (API unreachable)
        if: steps.reachability.outputs.status != '200'
        run: |
          echo "Contract tests skipped — both citation.is and citation.manus.space returned non-200."
          echo "Tests will run automatically once the live API is restored."

  drive-staleness:
    name: Drive Staleness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check manus-persistent-drive freshness
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Gudmundur76/manus-persistent-drive/commits?per_page=1" 2>&1) || true
          if echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['commit']['committer']['date'])" 2>/dev/null; then
            LAST_COMMIT_ISO=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['commit']['committer']['date'])")
            LAST_COMMIT_TS=$(date -d "$LAST_COMMIT_ISO" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            AGE_HOURS=$(( (NOW_TS - LAST_COMMIT_TS) / 3600 ))
            echo "Drive last synced: ${AGE_HOURS}h ago (commit: ${LAST_COMMIT_ISO})"
            if [ "$AGE_HOURS" -gt 48 ]; then
              echo "::error::manus-persistent-drive is STALE: last synced ${AGE_HOURS}h ago (threshold: 48h)."
              exit 1
            else
              echo "Drive is fresh (${AGE_HOURS}h < 48h threshold). OK."
            fi
          else
            echo "::warning::Could not read manus-persistent-drive via API. Add DRIVE_PAT secret for strict enforcement."
          fi
